plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noads.browser.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.noads.browser.tv'
        minSdk 21
        targetSdk 35
        versionCode 17
        versionName '0.1.7-tv'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
